# docker-compose.no-gpu.yml
# Version SANS GPU — pour tester la stack complète sans NVIDIA
# Usage : docker compose -f docker-compose.no-gpu.yml up -d
#
# Les workers tourneront en mode CPU (inférence lente mais fonctionnelle)
# Toutes les pages Streamlit seront accessibles avec mode démo

services:

  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - WS_BASE_URL=ws://api:8000
    volumes:
      - ./streamlit_app:/app
      - video_data:/data/videos
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vlm_net
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://vlm:vlm@postgres:5432/vlmdb
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MODELS_PATH=/models
      - VIDEO_DIR=/data/videos
    volumes:
      - ./api:/app
      - video_data:/data/videos
      - model_weights:/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vlm_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Workers sans GPU (pas de section deploy/resources)
  worker_vlm:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q vlm_queue -c 1 --loglevel=info -n vlm_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODELS_PATH=/models
      - VIDEO_DIR=/data/videos
    volumes:
      - ./api:/app
      - video_data:/data/videos
      - model_weights:/models
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vlm_net
    restart: unless-stopped

  worker_detection:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q detection_queue -c 2 --loglevel=info -n detection_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODELS_PATH=/models
      - VIDEO_DIR=/data/videos
    volumes:
      - ./api:/app
      - video_data:/data/videos
      - model_weights:/models
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vlm_net
    restart: unless-stopped

  worker_clustering:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q clustering_queue -c 1 --loglevel=info -n clustering_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MODELS_PATH=/models
      - VIDEO_DIR=/data/videos
    volumes:
      - ./api:/app
      - video_data:/data/videos
      - model_weights:/models
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vlm_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vlm_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vlm
      POSTGRES_PASSWORD: vlm
      POSTGRES_DB: vlmdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vlm_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlm -d vlmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - vlm_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - vlm_net
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vlm_net
    restart: unless-stopped

networks:
  vlm_net:
    driver: bridge

volumes:
  video_data:
  model_weights:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
