[pytest]
asyncio_mode       = auto
testpaths          = tests
python_files       = test_*.py
python_classes     = Test*
python_functions   = test_*
addopts            =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:warnings

markers =
    slow: tests lents nécessitant un GPU ou des modèles réels
    gpu:  tests nécessitant un GPU CUDA
    integration: tests d'intégration nécessitant tous les services

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch
